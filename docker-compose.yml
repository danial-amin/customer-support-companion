services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: customer-support-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-us-east-1}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-customer-support}
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3001","http://localhost:3003","http://localhost:5173","http://localhost"]
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - customer-support-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customer-support-frontend
    ports:
      - "3003:80"  # Using 3003 externally to avoid conflicts
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - customer-support-network

  # Optional: PostgreSQL database for SQL agent
  postgres:
    image: postgres:15-alpine
    container_name: customer-support-db
    environment:
      - POSTGRES_DB=${DB_NAME:-customersupport}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"  # Using 5433 externally to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - customer-support-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  customer-support-network:
    driver: bridge

volumes:
  postgres_data:

